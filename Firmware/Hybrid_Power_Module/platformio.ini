[env:stm32_canbus]
platform = ststm32
board = genericSTM32F103CB
board_build.mcu = stm32f103cbt6
framework = arduino
debug_tool = stlink
upload_protocol = stlink

upload_flags =
    -c

build_flags =
    -DHAL_CAN_MODULE_ENABLED
    ; Set HSE based on physical crystal
    -DHSE_VALUE=16000000U
    -Wall
    -Wextra
    -Werror
    -fno-exceptions

lib_deps =

; Local: points into av-libraries/ so PlatformIO discovers AimNetwork + logger.
; When the flash stack is added, mirror GPS_Module: lib_ldf_mode = deep+ and
; -Wno-unused-function for the bundled littlefs.
lib_extra_dirs = ../../../av-libraries/
